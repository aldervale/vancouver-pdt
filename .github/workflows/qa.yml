name: Site QA
on:
  push:
    branches: [fix/site-qa-accessibility, fix/design-review-oct28]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require zero production dependency advisories
        run: npm audit --omit=dev
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - run: npm run test:preview-security -- --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  container:
    name: Production image smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and smoke the final production-only image
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          docker build --pull --build-arg COMMIT_SHA="$sha" -t bcdaylight-runtime:qa .
          node scripts/smoke-container.mjs bcdaylight-runtime:qa "$sha"
          node scripts/smoke-staging-overlay.mjs bcdaylight-runtime:qa "$sha"
